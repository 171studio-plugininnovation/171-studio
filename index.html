    <!-- Spotify IFrame API SDK initialization catcher & loader -->
    <script>
      window.__spotifyCallbacks = window.__spotifyCallbacks || [];
      window.onSpotifyIframeApiReady = function(IFrameAPI) {
        window.SpotifyIframeApi = IFrameAPI;
        if (window.__spotifyCallbacks && window.__spotifyCallbacks.length) {
          window.__spotifyCallbacks.forEach(function(cb) {
            try { cb(IFrameAPI); } catch(e) { console.error('Spotify ready callback error:', e); }
          });
        }
      };
    </script>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
